test_operation:
  stage: test
  script:
    - pytest ./code/test_lexeur.py::test_operation --timeout=180 --forked --junitxml=resultat.xml
  artifacts:
    reports:
      junit: [./resultat.xml]
  timeout: 4m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 3m

