image: gibson-registry.telecomnancy.univ-lorraine.fr/projets/2526/pcl/projet/fise-groupe-21:latest

stages:
  - build-image
  - build
  - test
  - clean

build-image-job:
  stage: build-image
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  # pour qu'il se lance que si il vient de schedule
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  # image pré faite
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}"

